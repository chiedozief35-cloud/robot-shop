jaeger:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

userconfig:
  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133

    jaeger_storage:
      backends:
        primary_store:
          memory:
            max_traces: 2000

    jaeger_query:
      storage:
        traces: primary_store
      http:
        endpoint: 0.0.0.0:16686

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 1s
      send_batch_size: 256

  exporters:
    jaeger_storage_exporter:
      trace_storage: primary_store

  service:
    extensions:
      - healthcheckv2
      - jaeger_storage
      - jaeger_query
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter]
