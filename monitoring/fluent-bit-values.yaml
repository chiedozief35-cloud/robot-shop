kind: DaemonSet

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

tolerations:
  - operator: Exists
    effect: NoSchedule

config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*_robot-shop_*.log
        Tag               kube.*
        multiline.parser  docker, cri
        DB                /var/log/fluent-bit-robot-shop.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Read_from_Head    Off
        Refresh_Interval  5

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       app
        Keep_Log            On
        Labels              On
        Annotations         Off

    [FILTER]
        Name    lua
        Match   kube.*
        script  /fluent-bit/scripts/normalize.lua
        call    normalize

  outputs: |
    [OUTPUT]
        Name        loki
        Match       kube.*
        Host        loki-gateway.logging.svc.cluster.local
        Port        80
        Labels      job=fluent-bit,namespace=$namespace,service=$service,level=$level
        Line_Format json
        Retry_Limit False

luaScripts:
  normalize.lua: |
    function normalize(tag, timestamp, record)
        local k = record["kubernetes"] or {}
        local labels = k["labels"] or {}
        record["namespace"] = k["namespace_name"] or "robot-shop"
        record["service"] = labels["service"] or k["container_name"] or "unknown"

        local app = record["app"]
        local level = nil
        if type(app) == "table" then
            level = app["level"] or app["severity"]
        end

        local numeric = tonumber(level)
        if numeric then
            local levels = {
                [10]="trace", [20]="debug", [30]="info",
                [40]="warn", [50]="error", [60]="fatal"
            }
            level = levels[numeric]
        elseif type(level) == "string" then
            level = string.lower(level)
        end

        if not level then
            local message = string.lower(tostring(record["log"] or ""))
            for _, candidate in ipairs({
                "fatal", "critical", "error", "warning",
                "warn", "info", "debug", "trace"
            }) do
                if string.find(message, "%f[%a]" .. candidate .. "%f[%A]") then
                    level = candidate
                    break
                end
            end
        end

        if level == "warning" then level = "warn" end
        local allowed = {
            trace=true, debug=true, info=true, warn=true,
            error=true, fatal=true, critical=true
        }
        if not allowed[level] then level = "unknown" end
        record["level"] = level
        return 2, timestamp, record
    end
